name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        # Naming bash explicitly is what turns on pipefail. Without it a step
        # ending in a pipe reports only the last command's status, so an
        # earlier stage can fail and the step still passes.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build worker
        working-directory: engine
        run: cargo build --package network-engine-worker

      - name: Build
        run: go build ./...

      - name: Test
        id: test
        run: |
          go test ./... -json | tee "$RUNNER_TEMP/gotest.json" \
            | jq -j 'select(.Action == "output" or .Action == "build-output") | .Output'

      - name: Test summary
        if: '!cancelled() && steps.test.conclusion != ''skipped'''
        run: |
          counts=$(jq -r '
            select(.Test != null and (.Test | contains("/") | not))
            | select(.Action == "pass" or .Action == "fail" or .Action == "skip")
            | .Action
          ' "$RUNNER_TEMP/gotest.json" | sort | uniq -c)

          skipped=$(jq -r '
            select(.Action == "skip" and .Test != null)
            | "\(.Package)\t\(.Test)"
          ' "$RUNNER_TEMP/gotest.json" | sort)

          {
            echo "### Go test results (top-level tests, subtests not counted)"
            echo
            echo '```'
            echo "${counts:-none}"
            echo '```'
            echo
            echo "Skipped tests (subtests included):"
            echo
            echo '```'
            echo "${skipped:-none}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test record
        if: '!cancelled() && steps.test.conclusion != ''skipped'''
        uses: actions/upload-artifact@v7
        with:
          name: go-test-json
          path: ${{ runner.temp }}/gotest.json

      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          # Exclude internal/testutil from scan — test-only infrastructure
          # that pulls in docker/docker via testcontainers-go. These vulns
          # are in the Docker daemon, not the client, and the package never
          # ships in any binary.
          go list ./... | grep -v internal/testutil | xargs govulncheck

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit
