name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# At workflow level rather than per job, so a job added later inherits least
# privilege instead of relying on its author to declare it. Declaring any
# permission sets every scope not listed here to none.
permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        # Naming bash explicitly is what turns on pipefail. Without it a step
        # ending in a pipe reports only the last command's status, so an
        # earlier stage can fail and the step still passes.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # A later step needing git credentials fails with an auth error
          # rather than silently inheriting one.
          persist-credentials: false

      - name: Pin check behaves
        run: scripts/check-go-pins-test.sh

      - name: Go version pins agree
        run: scripts/check-go-pins.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build worker
        working-directory: engine
        run: cargo build --package network-engine-worker

      - name: Build
        run: go build ./...

      - name: Test
        id: test
        run: |
          go test ./... -json | tee "$RUNNER_TEMP/gotest.json" \
            | jq -j 'select(.Action == "output" or .Action == "build-output") | .Output'

      - name: Test summary
        if: '!cancelled() && steps.test.conclusion != ''skipped'''
        run: |
          counts=$(jq -r '
            select(.Test != null and (.Test | contains("/") | not))
            | select(.Action == "pass" or .Action == "fail" or .Action == "skip")
            | .Action
          ' "$RUNNER_TEMP/gotest.json" | sort | uniq -c)

          skipped=$(jq -r '
            select(.Action == "skip" and .Test != null)
            | "\(.Package)\t\(.Test)"
          ' "$RUNNER_TEMP/gotest.json" | sort)

          {
            echo "### Go test results (top-level tests, subtests not counted)"
            echo
            echo '```'
            echo "${counts:-none}"
            echo '```'
            echo
            echo "Skipped tests (subtests included):"
            echo
            echo '```'
            echo "${skipped:-none}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test record
        if: '!cancelled() && steps.test.conclusion != ''skipped'''
        uses: actions/upload-artifact@v7
        with:
          name: go-test-json
          path: ${{ runner.temp }}/gotest.json

      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Lint wrapper behaves
        run: scripts/lint-go-test.sh

      # run does not validate the config. A misspelled key is accepted, the
      # linter set silently falls back, and the run reports no issues.
      - name: Lint config is valid
        run: |
          scripts/lint-go.sh --check-only
          golangci-lint config verify

      - name: Lint
        run: scripts/lint-go.sh

      - name: Audit scan covers what it should
        run: scripts/audit-go-test.sh

      - name: Vulnerability check
        env:
          GOVULNCHECK_VERSION: v1.8.0
        run: |
          # GOBIN explicitly, because a go install without one lands in the
          # active toolchain's bin directory, which another entry on PATH can
          # shadow.
          export GOBIN="$RUNNER_TEMP/gobin"
          mkdir -p "$GOBIN"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          # The scan is only as pinned as the binary that runs it, and a bare
          # govulncheck off PATH is not necessarily the one just installed.
          # -x so a prerelease suffix cannot satisfy the match, -F because the
          # pin contains dots, which are any-char unescaped.
          "$GOBIN/govulncheck" -version
          "$GOBIN/govulncheck" -version | grep -qxF "Scanner: govulncheck@$GOVULNCHECK_VERSION"
          PATH="$GOBIN:$PATH" scripts/audit-go.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.1
    defaults:
      run:
        # Naming bash explicitly is what turns on pipefail. Without it a step
        # ending in a pipe reports only the last command's status, so an
        # earlier stage can fail and the step still passes.
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          # A later step needing git credentials fails with an auth error
          # rather than silently inheriting one.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Restore cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Security audit
        run: |
          # A restore can succeed and still hand back the wrong or a truncated
          # binary, and the scan would then report green from an unpinned tool.
          # -x so a prerelease suffix cannot satisfy the match, -F because the
          # pin contains dots, which are any-char unescaped.
          cargo audit --version
          cargo audit --version | grep -qxF "cargo-audit-audit $CARGO_AUDIT_VERSION"
          cargo audit
