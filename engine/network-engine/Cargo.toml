[package]
name = "network-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
serde_json = "1"
