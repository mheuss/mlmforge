[package]
name = "network-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
# preserve_order: keep JSON object key order through serde_json::Value so the
# width-contract test (tests/config_width_contract.rs) can mutate a fixture and
# re-deserialize it without re-sorting structure keys to config-before-type,
# which would re-break the engine's adjacently-tagged StructureConfig. Dev-only.
serde_json = { version = "1", features = ["preserve_order"] }
