# Invalid: pass_up count is 0, which violates the minimum of 1.
# Expected error: schema_violation on pass_up/count.

name: Bad PassUp Count
version: 1

period:
  length: month
  start_date: "2026-01-01"
  payout_lag_days: 14

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Associate
    ordinal: 1
    qualification:
      structures:
        - structure: Primary
          personal_volume: 0
          group_volume: 0

