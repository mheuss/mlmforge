# Invalid: pass_up placed on a binary structure where it does not apply.
# The JSON schema does not reject additional properties, so this passes schema
# validation. However, the pass_up field is silently dropped during
# deserialization because BinaryCommission has no PassUp field.

name: PassUp On Binary
version: 1

period:
  length: week
  start_date: "2026-01-01"
  payout_lag_days: 3

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Member
    ordinal: 1
    qualification:
      structures:
        - structure: BinaryTree
          personal_volume: 0
          group_volume: 0

rank_tracking:
  track_achieved_rank: false

rank_features:
  constraints_enabled: false
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 0
  require_order_in_period: false
  eligible_statuses:
    - active

structures:
  - name: BinaryTree
    type: binary
    commission:
      mode: pairing
      pairing:
        percent: 0.10
        calculation: weaker_leg
        cap_per_period: 5000.00
        volume_after_payout: carry_forward
        carry_forward_cap: 20000.00
      pass_up:
        count: 2
        includes_commissions: false

bonuses:
  matching: null
  sponsor: null
  fast_start: null
  rank_advancement: null
  leadership_development: null
  infinity: null
  lifestyle: null
  pool: null
  matrix_completion: null
  position: null
  board_cycling: null

payout:
  base_currency: USD
  minimum_amount: 25.00
  split_payouts_enabled: false
  methods:
    - type: bank_transfer
      fee: 2.50

caps:
  company_payout_cap_percent: 0.40
  cap_enforcement: hard_stop
  clawback_on_refund: false

placement:
  donated_placement_enabled: false
