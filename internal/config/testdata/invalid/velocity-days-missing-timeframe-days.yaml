# Invalid: velocity qualification uses timeframe "days" without timeframe_days.
# Expected error: timeframe_days is required when timeframe is "days".

name: Velocity Missing Days
version: 1

period:
  length: month
  start_date: "2026-01-01"
  payout_lag_days: 14

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Associate
    ordinal: 1
    qualification:
      structures:
        - structure: Primary
          personal_volume: 0
          group_volume: 0

rank_tracking:
  track_achieved_rank: false

rank_features:
  constraints_enabled: false
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 0
  require_order_in_period: false
  eligible_statuses:
    - active

structures:
  - name: Primary
    type: unilevel
    commission:
      commissionable_depth: 5
      rate_table:
        Associate:
          "1": 0.05

bonuses:
  pool:
    - name: Speed Pool
      source_percent: 0.02
      qualification:
        mode: velocity_based
        velocity:
          volume_target: 5000.00
          timeframe: days
          # timeframe_days intentionally omitted
      shares:
        mode: equal_share
      require_admin_confirmation: false

payout:
  base_currency: USD
  minimum_amount: 50.00
  split_payouts_enabled: false
  methods:
    - type: bank_transfer
      fee: 2.50

caps:
  company_payout_cap_percent: 0.42
  cap_enforcement: pro_rata
  clawback_on_refund: false

placement:
  donated_placement_enabled: false
