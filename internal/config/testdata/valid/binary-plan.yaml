# yaml-language-server: $schema=../../../../schemas/compensation-plan.schema.json
#
# Binary plan with pairing mode. Tests binary commission discriminator,
# pairing config, and binary-specific placement.

name: Classic Binary
version: 1

period:
  length: week
  start_date: "2026-01-01"
  payout_lag_days: 3

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Member
    ordinal: 1
    qualification:
      structures:
        - structure: BinaryTree
          personal_volume: 0
          group_volume: 0

  - name: Silver
    ordinal: 2
    qualification:
      structures:
        - structure: BinaryTree
          personal_volume: 100
          group_volume: 1000

  - name: Gold
    ordinal: 3
    qualification:
      structures:
        - structure: BinaryTree
          personal_volume: 200
          group_volume: 5000

rank_tracking:
  track_achieved_rank: true

rank_features:
  constraints_enabled: true
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 50
  require_order_in_period: true
  eligible_statuses:
    - active

structures:
  - name: BinaryTree
    type: binary
    commission:
      mode: pairing
      pairing:
        percent: 0.10
        calculation: weaker_leg
        cap_per_period: 5000.00
        volume_after_payout: carry_forward
        carry_forward_cap: 20000.00

bonuses:
  matching: null
  sponsor:
    amount: 0.10
    amount_type: percentage
  fast_start: null
  rank_advancement: null
  leadership_development: null
  infinity: null
  lifestyle: null
  pool: null
  matrix_completion: null
  position: null
  board_cycling: null
  pass_up: null

payout:
  base_currency: USD
  minimum_amount: 25.00
  split_payouts_enabled: false
  methods:
    - type: bank_transfer
      fee: 2.50

caps:
  company_payout_cap_percent: 0.40
  cap_enforcement: hard_stop
  clawback_on_refund: true

placement:
  donated_placement_enabled: true
  donated_placement_restriction: direct_children_only
  binary:
    default_placement: balanced
    per_user_preference: true
    spillover_enabled: true
