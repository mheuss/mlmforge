# yaml-language-server: $schema=../../../../schemas/compensation-plan.schema.json
#
# Board plan with companion unilevel. Tests board_plan structure type,
# board cycling commission, and companion unilevel validation rule.

name: Sales Board Plan
version: 1

period:
  length: month
  start_date: "2026-01-01"
  payout_lag_days: 14

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Member
    ordinal: 1
    demotion_policy: promotion_only
    qualification:
      structures:
        - structure: Overrides
          personal_volume: 0
          group_volume: 0

  - name: Leader
    ordinal: 2
    demotion_policy: promotion_only
    qualification:
      structures:
        - structure: Overrides
          personal_volume: 100
          group_volume: 2000

rank_tracking:
  track_achieved_rank: false

rank_features:
  constraints_enabled: false
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 0
  require_order_in_period: false
  eligible_statuses:
    - active

structures:
  - name: Overrides
    type: unilevel
    commission:
      commissionable_depth: 5
      rate_table:
        Member:
          "1": 0.05
          "2": 0.03
        Leader:
          "1": 0.08
          "2": 0.05
          "3": 0.03
          "4": 0.02
          "5": 0.01

  - name: Sales Board
    type: board_plan
    structure:
      width: 2
      height: 2
    commission:
      board_cycling:
        cycle_commission: 500.0
        re_entry_enabled: true
        re_entry_position: bottom
        max_cycles_per_period: 5
        max_cascade_depth: 10
        stall_threshold_periods: 3
        inactive_compression: true

bonuses:
  matching: null
  sponsor: null
  fast_start: null
  rank_advancement: null
  leadership_development: null
  infinity: null
  lifestyle: null
  pool: null
  matrix_completion: null
  position: null
  board_cycling:
    cycle_commission: 500.0
    re_entry_enabled: true
    re_entry_position: bottom
    max_cycles_per_period: 5
    max_cascade_depth: 10
    stall_threshold_periods: 3
    inactive_compression: true

payout:
  base_currency: USD
  minimum_amount: 50.00
  split_payouts_enabled: false
  methods:
    - type: bank_transfer
      fee: 2.50

caps:
  company_payout_cap_percent: 0.42
  cap_enforcement: pro_rata
  clawback_on_refund: false

placement:
  donated_placement_enabled: false
