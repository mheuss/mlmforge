# yaml-language-server: $schema=../../../../schemas/compensation-plan.schema.json
#
# Hybrid plan with two structures: unilevel + binary. Tests multi-structure
# plans where ranks can qualify for specific structures.

name: Hybrid Unilevel-Binary
version: 1

period:
  length: month
  start_date: "2026-01-01"
  payout_lag_days: 14

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Associate
    ordinal: 1
    qualification:
      structures:
        - structure: UniTeam
          personal_volume: 0
          group_volume: 0
    qualified_structures:
      - UniTeam
    demotion_policy: promotion_only

  - name: Builder
    ordinal: 2
    qualification:
      structures:
        - structure: UniTeam
          personal_volume: 100
          group_volume: 500
        - structure: PowerLeg
          personal_volume: 100
          group_volume: 1000
    qualified_structures:
      - UniTeam
      - PowerLeg
    demotion_policy:
      grace:
        count: 2
        unit: months

  - name: Leader
    ordinal: 3
    qualification:
      structures:
        - structure: UniTeam
          personal_volume: 200
          group_volume: 2000
        - structure: PowerLeg
          personal_volume: 200
          group_volume: 5000
    qualified_structures:
      - UniTeam
      - PowerLeg
    demotion_policy:
      grace:
        count: 3
        unit: months

rank_tracking:
  track_achieved_rank: true

rank_features:
  constraints_enabled: true
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 50
  require_order_in_period: true
  eligible_statuses:
    - active

structures:
  - name: UniTeam
    type: unilevel
    commission:
      commissionable_depth: 5
      rate_table:
        Associate:
          "1": 0.05
          "2": 0.03
        Builder:
          "1": 0.08
          "2": 0.05
          "3": 0.03
        Leader:
          "1": 0.10
          "2": 0.07
          "3": 0.05
          "4": 0.03
          "5": 0.02

  - name: PowerLeg
    type: binary
    commission:
      mode: pairing
      pairing:
        percent: 0.10
        calculation: weaker_leg
        cap_per_period: 10000.00
        volume_after_payout: net_off
        carry_forward_cap: null

bonuses:
  matching:
    depth: 2
    rates:
      "1": 0.10
      "2": 0.05
    matched_commission_types:
      - unilevel
      - binary
  sponsor: null
  fast_start: null
  rank_advancement: null
  leadership_development: null
  infinity: null
  lifestyle: null
  pool: null
  matrix_completion: null
  position: null
  board_cycling: null

payout:
  base_currency: USD
  minimum_amount: 25.00
  split_payouts_enabled: true
  methods:
    - type: bank_transfer
      fee: 2.50
    - type: ewallet
      fee: 0.00

caps:
  company_payout_cap_percent: 0.42
  cap_enforcement: pro_rata
  clawback_on_refund: true

placement:
  donated_placement_enabled: true
  donated_placement_restriction: own_downline
  binary:
    default_placement: left
    per_user_preference: true
    spillover_enabled: true
