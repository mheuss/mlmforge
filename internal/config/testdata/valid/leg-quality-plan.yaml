# yaml-language-server: $schema=../../../../schemas/compensation-plan.schema.json
#
# Leg-quality rank plan. Exercises HEU-444 leg_quality predicates:
# contains_rank (Oriflame President-style tiered legs) and
# contains_personal_volume (Monat Active Lines-style).

name: Leg Quality Plan
version: 1

period:
  length: month
  start_date: "2026-01-01"
  payout_lag_days: 14

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Associate
    ordinal: 1
    qualification:
      structures:
        - structure: Primary
          personal_volume: 0
          group_volume: 0
    demotion_policy: promotion_only

  - name: Gold
    ordinal: 2
    qualification:
      structures:
        - structure: Primary
          personal_volume: 100
          group_volume: 2000
          leg_quality:
            - count: 2
              predicate:
                type: contains_personal_volume
                min_personal_volume: 200
    demotion_policy: promotion_only

  - name: Diamond
    ordinal: 3
    qualification:
      structures:
        - structure: Primary
          personal_volume: 200
          group_volume: 5000
    demotion_policy: promotion_only

  - name: President
    ordinal: 4
    qualification:
      structures:
        - structure: Primary
          personal_volume: 300
          group_volume: 10000
          leg_quality:
            - count: 3
              predicate:
                type: contains_rank
                min_rank: Gold
            - count: 1
              predicate:
                type: contains_rank
                min_rank: Diamond
    demotion_policy: promotion_only

rank_tracking:
  track_achieved_rank: false

rank_features:
  constraints_enabled: false
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 0
  require_order_in_period: false
  eligible_statuses:
    - active

structures:
  - name: Primary
    type: unilevel
    commission:
      commissionable_depth: 5
      rate_table:
        Associate:
          "1": 0.05
        Gold:
          "1": 0.07
        Diamond:
          "1": 0.10
        President:
          "1": 0.12

bonuses:
  matching: null
  sponsor: null
  fast_start: null
  rank_advancement: null
  leadership_development: null
  infinity: null
  lifestyle: null
  pool: null
  matrix_completion: null
  position: null
  board_cycling: null

payout:
  base_currency: USD
  minimum_amount: 50.00
  split_payouts_enabled: false
  methods:
    - type: bank_transfer
      fee: 2.50

caps:
  company_payout_cap_percent: 0.42
  cap_enforcement: pro_rata
  clawback_on_refund: false

placement:
  donated_placement_enabled: false
