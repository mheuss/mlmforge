# yaml-language-server: $schema=../../../../schemas/compensation-plan.schema.json
#
# Windowed rank qualification plan. Exercises the HEU-446 window gate:
# a distributor must have achieved threshold_rank in at least qualifying_periods
# of the last window_periods prior periods to hold a rank.

name: Windowed Rank Plan
version: 1

period:
  length: month
  start_date: "2026-01-01"
  payout_lag_days: 14

volume:
  inhibit_signup_volume: false
  base_currency: USD
  volume_to_dollar_multiplier: 1.0
  deduct_qualifying_volume: false

ranks:
  - name: Associate
    ordinal: 1
    qualification:
      structures:
        - structure: Primary
          personal_volume: 0
          group_volume: 0

  - name: Leader
    ordinal: 2
    qualification:
      structures:
        - structure: Primary
          personal_volume: 100
          group_volume: 1000
      window:
        threshold_rank: Associate
        qualifying_periods: 3
        window_periods: 6

  - name: Director
    ordinal: 3
    qualification:
      structures:
        - structure: Primary
          personal_volume: 200
          group_volume: 5000
      window:
        threshold_rank: Leader
        qualifying_periods: 6
        window_periods: 12

rank_tracking:
  track_achieved_rank: false

rank_features:
  constraints_enabled: false
  overrides_enabled: false

commission_eligibility:
  min_personal_volume: 0
  require_order_in_period: false
  eligible_statuses:
    - active

structures:
  - name: Primary
    type: unilevel
    commission:
      commissionable_depth: 5
      rate_table:
        Associate:
          "1": 0.05
        Leader:
          "1": 0.07
        Director:
          "1": 0.10

bonuses:
  matching: null
  sponsor: null
  fast_start: null
  rank_advancement: null
  leadership_development: null
  infinity: null
  lifestyle: null
  pool: null
  matrix_completion: null
  position: null
  board_cycling: null

payout:
  base_currency: USD
  minimum_amount: 50.00
  split_payouts_enabled: false
  methods:
    - type: bank_transfer
      fee: 2.50

caps:
  company_payout_cap_percent: 0.42
  cap_enforcement: pro_rata
  clawback_on_refund: false

placement:
  donated_placement_enabled: false
