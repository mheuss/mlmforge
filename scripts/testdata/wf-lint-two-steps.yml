jobs:
  go:
    steps:
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Lint something else
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
